<!DOCTYPE html>
<html lang="ar" dir="rtl">

  <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="card">

    لديك حساب بالفعل؟

<script src="script.js"></script>
<script>
  document.getElementById("regBtn").addEventListener("click", register);
</script>
</body>
</html>
